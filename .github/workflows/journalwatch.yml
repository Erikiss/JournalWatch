name: JournalWatch Daily

on:
  schedule:
    # Täglich um 06:00 UTC (08:00 MESZ / 07:00 MEZ)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journalwatch
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run JournalWatch
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python journalwatch.py --days 2

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "JournalWatch-Report $(date -u +%F)"
            git push
          fi
